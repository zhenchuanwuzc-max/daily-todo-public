<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日待办 · 项目跟进</title>
<style>
  :root {
    --bg: #fbfaf7;
    --surface: #ffffff;
    --line: #ececea;
    --line-soft: #f3f2ef;
    --text: #1f1f1f;
    --text-2: #5f5f5d;
    --muted: #a0a09e;
    --accent: #0f766e;
    --hover: rgba(0,0,0,0.025);
    --p0: #dc2626;
    --p1: #ea580c;
    --p2: #ca8a04;
    --p3: #9ca3af;
    --pn: #cbcbc8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased;
    padding: 24px;
    min-width: 872px;
    font-size: 14px;
  }
  .app-shell { max-width: 1080px; margin: 0 auto; }
  .app-toolbar {
    position: sticky; top: 0; z-index: 30;
    margin-left: 184px; margin-bottom: 12px; padding: 12px 0;
    background: var(--bg);
  }
  .app-toolbar.is-stuck { box-shadow: 0 1px 0 var(--line); }
  .app-layout {
    display: grid; grid-template-columns: 160px minmax(0, 1fr);
    gap: 24px; align-items: start;
  }
  .wrap { width: 100%; min-width: 0; }
  .priority-nav { position: sticky; top: 24px; }
  .priority-nav-title { color: var(--muted); font-size: 11px; line-height: 20px; padding: 8px 10px; }
  .priority-nav-items { display: flex; flex-direction: column; gap: 4px; }
  .priority-link {
    display: flex; align-items: center; gap: 8px; width: 100%;
    min-height: 40px; padding: 8px 10px; border: 1px solid transparent; border-radius: 8px;
    background: transparent; color: var(--text-2); font: inherit; font-size: 12px;
    cursor: pointer; text-align: left; white-space: nowrap;
  }
  .priority-link:hover:not(:disabled) { background: var(--hover); }
  .priority-link[aria-current="location"] {
    background: #eaf3f0; border-color: #d4e7e0; color: var(--accent); font-weight: 600;
  }
  .priority-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .priority-link:disabled { opacity: 0.4; cursor: default; }
  .priority-link .nav-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .priority-link .nav-count { margin-left: auto; font-variant-numeric: tabular-nums; }
  .priority-link[data-group="DN"] { margin-top: 8px; }

  header {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    margin-bottom: 16px; padding: 0;
  }
  h1 { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  h1 .total { color: var(--muted); font-weight: 400; margin-left: 10px; font-size: 13px; }
  .meta { font-size: 11px; color: var(--muted); }

  /* 添加栏 —— 极简，只留输入和右侧两小下拉 */
  .add {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--line);
    padding: 10px 12px; border-radius: 10px;
    margin-bottom: 0;
    transition: border-color 0.15s;
  }
  .add:focus-within { border-color: var(--accent); }
  .add textarea {
    flex: 1; min-width: 0; border: none; outline: none; font-size: 14px;
    background: transparent; color: var(--text);
    resize: none; min-height: 20px; max-height: 160px;
    font-family: inherit; line-height: 1.5;
    overflow-y: auto;
    padding: 0;
  }
  .add textarea::placeholder { color: var(--muted); }
  .add select {
    appearance: none; -webkit-appearance: none;
    border: none; background: transparent; outline: none;
    font-size: 12px; color: var(--text-2);
    cursor: pointer; padding: 3px 6px; border-radius: 4px;
    font-family: inherit;
  }
  .add select:hover { background: var(--hover); }
  .add #addBtn {
    background: var(--accent); color: white; border: none;
    padding: 6px 14px; border-radius: 6px; cursor: pointer;
    font-size: 13px; font-weight: 500;
    margin-left: 4px;
  }
  .add #addBtn:hover { opacity: 0.92; }

  /* 分组段落 */
  .group { margin-bottom: 24px; }
  .group-head {
    position: sticky; top: var(--toolbar-height, 76px); z-index: 10;
    background: var(--bg);
    display: flex; align-items: baseline; gap: 10px;
    padding: 8px 4px; line-height: 20px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 2px;
  }
  .group-head .pri-dot {
    width: 8px; height: 8px; border-radius: 50%; align-self: center;
  }
  .group-head .label {
    font-size: 12px; font-weight: 600; letter-spacing: 0.3px;
    text-transform: uppercase;
  }
  .group-head .label-cn { font-size: 13px; color: var(--text-2); font-weight: 500; margin-left: -4px; }
  .group-head .count {
    margin-left: auto; font-size: 12px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .group.P0 .pri-dot { background: var(--p0); }   .group.P0 .label { color: var(--p0); }
  .group.P1 .pri-dot { background: var(--p1); }   .group.P1 .label { color: var(--p1); }
  .group.P2 .pri-dot { background: var(--p2); }   .group.P2 .label { color: var(--p2); }
  .group.P3 .pri-dot { background: var(--p3); }   .group.P3 .label { color: var(--p3); }
  .group.PN .pri-dot { background: var(--pn); }   .group.PN .label { color: var(--text-2); }
  .group.DN .pri-dot { background: var(--pn); }   .group.DN .label { color: var(--muted); font-weight: 500; }

  /* 可折叠分组 */
  .group-head.collapsible { cursor: pointer; user-select: none; }
  .group-head.collapsible:hover { background: var(--hover); border-radius: 4px; }
  .group-head .toggle {
    font-size: 10px; color: var(--muted);
    transition: transform 0.15s; display: inline-block;
    margin-left: 4px;
  }
  .group.collapsed .toggle { transform: rotate(-90deg); }
  .group.collapsed > ul { display: none; }

  /* 任务行 */
  ul { list-style: none; }
  li {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 8px;
    border-bottom: 1px solid var(--line-soft);
    transition: background-color 0.1s;
    border-radius: 4px;
  }
  li:last-child { border-bottom: none; }
  .group > ul > li, li.task-drag-preview {
    min-height: 44px; padding: 8px 4px; gap: 8px;
  }
  li[data-id] { position: relative; }
  li[data-id]:not(.suggest) > .meta-cell {
    flex: 0 0 124px; text-align: right; margin-left: 8px;
  }
  li[data-id]:not(.suggest) > .actions {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    min-width: 124px; justify-content: flex-end; padding: 4px 0 4px 8px;
    background: var(--bg); border-radius: 4px; z-index: 1; pointer-events: none;
  }
  .modal li[data-id]:not(.suggest) > .actions { background: var(--surface); }
  li[data-id]:hover > .actions, li[data-id]:focus-within > .actions { pointer-events: auto; }
  li:hover { background: var(--hover); }
  .drag-handle {
    border: 0; background: transparent; color: var(--muted);
    cursor: grab; width: 24px; height: 28px; padding: 4px;
    font-size: 18px; line-height: 20px;
    touch-action: none; user-select: none; flex-shrink: 0;
  }
  .drag-handle:hover, .drag-handle:focus-visible { color: var(--accent); }
  li.drag-placeholder {
    background: rgba(15, 118, 110, 0.07); outline: 2px dashed var(--accent);
    outline-offset: -2px;
  }
  li.drag-placeholder > * { visibility: hidden; }
  li.task-drag-preview {
    position: fixed; margin: 0; z-index: 10000; pointer-events: none;
    background: var(--surface, #fff); border: 1px solid var(--accent);
    border-radius: 8px; box-shadow: 0 14px 32px rgba(0, 0, 0, 0.18);
    opacity: 0.97; will-change: transform;
  }
  li.task-drag-preview .actions { visibility: hidden; }
  li.task-drag-preview .meta-cell { flex: 0 0 124px; text-align: right; margin-left: 8px; }
  li.task-drag-preview:not(.suggest) .actions { display: none; }
  li.task-drag-preview .drag-handle { color: var(--accent); }
  body.task-dragging, body.task-dragging * { cursor: grabbing !important; user-select: none !important; }
  li.done .text { text-decoration: line-through; color: var(--muted); }
  li.done { opacity: 0.7; }
  li.auto-skipped { opacity: 0.5; }
  li.auto-skipped .meta-cell { color: #b9a35a; }

  input[type=checkbox] {
    width: 16px; height: 16px; cursor: pointer;
    accent-color: var(--accent);
    flex-shrink: 0;
  }
  .text {
    flex: 1; font-size: 14px; line-height: 1.45;
    outline: none;
    min-width: 0; word-break: break-word;
  }
  .text[contenteditable=true]:focus {
    background: white; box-shadow: 0 0 0 1px var(--accent);
    border-radius: 4px; padding: 0 4px;
  }

  /* 行尾元数据 —— 全部纯灰文字 */
  .meta-cell {
    font-size: 12px; color: var(--muted);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .sep { color: var(--line); margin: 0 6px; user-select: none; }

  /* 右侧 hover 工具栏（priority 切换 + 删除）*/
  .actions {
    display: flex; align-items: center; gap: 4px;
    opacity: 0; transition: opacity 0.15s;
  }
  li:hover .actions, li:focus-within .actions { opacity: 1; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pri-select {
    appearance: none; -webkit-appearance: none;
    border: 1px solid var(--line); background: var(--surface);
    border-radius: 4px; padding: 2px 6px;
    font-size: 11px; font-weight: 600; cursor: pointer;
    font-family: inherit; outline: none; color: var(--text-2);
    min-width: 38px; text-align: center;
  }
  .pri-select.P0 { color: var(--p0); border-color: var(--p0); }
  .pri-select.P1 { color: var(--p1); border-color: var(--p1); }
  .pri-select.P2 { color: var(--p2); border-color: var(--p2); }
  .pri-select.P3 { color: var(--p3); border-color: var(--p3); }
  .pri-select.PN { color: var(--muted); }
  .pri-select option { color: var(--text); background: white; }
  .del {
    background: transparent; border: none; color: var(--muted);
    cursor: pointer; font-size: 16px; padding: 0 4px;
    line-height: 1;
  }
  .del:hover { color: #dc2626; }
  /* 建议行：✓采纳 / ✕拒绝（审阅动作，非"完成"）—— 始终可见，区别于普通行的完成 checkbox */
  .accept-lead {
    flex-shrink: 0;
    border: 1px solid #16a34a; background: #f0fdf4; color: #16a34a;
    border-radius: 5px; padding: 3px 9px;
    font-size: 12px; font-weight: 600; cursor: pointer;
    font-family: inherit; line-height: 1; white-space: nowrap;
  }
  .accept-lead:hover { background: #16a34a; color: #fff; }
  li.suggest .actions { opacity: 1; }   /* 采纳/拒绝不藏 hover */
  .del.reject { font-size: 12px; padding: 3px 6px; white-space: nowrap; }

  /* note 背景说明（claude-suggest 建议常驻显示）*/
  .text-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .text-wrap .text { flex: none; }
  .note {
    font-size: 12px; color: var(--text-2); line-height: 1.45;
    border-left: 2px solid var(--line); padding-left: 8px;
  }

  /* 💡 Claude 建议组 */
  .group.SG {
    background: #fdf9f0; border: 1px solid #f0e4c8;
    border-radius: 8px; padding: 14px 16px; margin-bottom: 28px;
  }
  .group.SG .pri-dot { background: #d9a441; }
  .group.SG .group-head { background: #fdf9f0; }
  .group.SG .label { color: #d9a441; }

  .empty {
    color: var(--muted); padding: 12px 4px; font-size: 13px;
    font-style: normal;
  }
  footer {
    margin-top: 24px; font-size: 11px; color: var(--muted);
    text-align: center;
  }

  /* === toast 反馈 === */
  .toast {
    position: fixed; bottom: 32px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(31,31,31,0.92); color: white;
    padding: 10px 18px; border-radius: 8px;
    font-size: 13px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.25);
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 200;
    min-width: 220px;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast .toast-text { display: block; }
  .toast .toast-progress {
    height: 4px; background: rgba(255,255,255,0.2);
    border-radius: 2px; margin-top: 6px; overflow: hidden;
    display: none;
  }
  .toast.with-progress .toast-progress { display: block; }
  .toast .toast-bar {
    height: 100%; background: #22c1a3;
    width: 0%; transition: width 0.25s;
  }

  /* === 更新提示 banner === */
  .update-banner {
    display: none;
    background: linear-gradient(135deg, #0f766e 0%, #115e59 100%);
    color: white;
    padding: 10px 16px; border-radius: 8px;
    margin-bottom: 16px;
    font-size: 13px;
    align-items: center; gap: 12px;
    box-shadow: 0 2px 8px rgba(15,118,110,0.25);
  }
  .update-banner.show { display: flex; }
  .update-banner .ub-text { flex: 1; }
  .update-banner .ub-ver { font-weight: 700; }
  .update-banner .ub-btn {
    background: white; color: var(--accent);
    border: none; padding: 5px 12px; border-radius: 5px;
    cursor: pointer; font-weight: 600; font-size: 12px;
  }
  .update-banner .ub-btn:hover { opacity: 0.92; }
  .update-banner .ub-close {
    background: transparent; border: none;
    color: white; opacity: 0.7;
    cursor: pointer; font-size: 18px; line-height: 1;
    padding: 0 4px;
  }
  .update-banner .ub-close:hover { opacity: 1; }

  /* === 头部按钮 === */
  .header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .btn-icon {
    background: transparent; border: 1px solid var(--line);
    color: var(--text-2); padding: 6px 10px; min-height: 30px;
    border-radius: 6px; cursor: pointer; font-size: 12px;
    font-family: inherit;
    transition: all 0.15s;
  }
  .btn-icon:hover { background: var(--hover); color: var(--text); border-color: var(--text-2); }

  /* === 模态框 === */
  .modal { position: fixed; inset: 0; z-index: 100; display: none; }
  .modal.show { display: block; }
  html:has(.modal.show) { overflow: hidden; }
  .modal-bg {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.32);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .modal-card {
    position: relative; width: calc(100% - 48px); max-width: 1040px; margin: 24px auto;
    background: var(--surface); border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.18);
    padding: 0 24px 24px;
    max-height: calc(100vh - 48px); overflow-y: auto; overscroll-behavior: contain;
  }
  .modal-head {
    display: flex; align-items: center; gap: 10px;
    position: sticky; top: 0; z-index: 2; background: var(--surface);
    padding: 18px 0; margin-bottom: 16px; border-bottom: 1px solid var(--line);
  }
  .modal-head h2 {
    font-size: 16px; font-weight: 600;
    margin-right: auto;
  }
  .modal-head .week-label {
    font-size: 14px; color: var(--text-2);
    font-variant-numeric: tabular-nums;
    min-width: 200px; text-align: center;
  }
  .modal-head .nav-btn {
    background: transparent; border: 1px solid var(--line);
    width: 28px; height: 28px; border-radius: 6px;
    cursor: pointer; color: var(--text-2);
    font-size: 14px; line-height: 1;
  }
  .modal-head .nav-btn:hover:not(:disabled) {
    background: var(--hover); color: var(--text);
  }
  .modal-head .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .modal-head .this-week {
    font-size: 12px; padding: 4px 10px;
    background: transparent; border: 1px solid var(--line);
    border-radius: 6px; cursor: pointer; color: var(--text-2);
  }
  .modal-head .close {
    background: transparent; border: none;
    font-size: 22px; cursor: pointer; color: var(--muted);
    line-height: 1; padding: 0 6px; min-width: 32px; min-height: 32px;
  }
  .modal-head .close:hover { color: var(--text); }

  /* === Excel 风周表 === */
  .review-table {
    width: 100%; border-collapse: collapse;
    margin-top: 8px;
    font-size: 13px;
    table-layout: fixed;
  }
  .review-table td {
    border: 1px solid var(--line);
    padding: 12px 14px;
    vertical-align: top;
    width: 33.33%;
  }
  .review-table .summary-row td {
    text-align: center;
    font-size: 15px; font-weight: 600;
    background: var(--bg);
    padding: 14px;
    color: var(--text);
  }
  .review-table .summary-row .summary-num {
    color: var(--accent); margin: 0 4px;
    font-variant-numeric: tabular-nums;
  }
  .review-table .day-cell { min-height: 110px; height: 110px; }
  .review-table .day-cell.today { background: rgba(15,118,110,0.04); }
  .review-table .day-cell.future { background: var(--bg); opacity: 0.5; }
  .review-table .day-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px dashed var(--line);
  }
  .review-table .day-head .dow {
    font-weight: 600; color: var(--text);
  }
  .review-table .day-head .ddate {
    font-size: 11px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .review-table .day-head .dcount {
    font-size: 11px; color: var(--muted);
  }
  .review-table .day-cell.today .day-head .dow { color: var(--accent); }
  .review-table .day-cell ul { list-style: none; padding: 0; }
  .review-table .day-cell li {
    display: flex; gap: 6px; align-items: baseline;
    padding: 3px 0; font-size: 12px;
    line-height: 1.45;
    border: none;
  }
  .review-table .day-cell li:hover { background: transparent; }
  .review-table .day-cell .check {
    color: var(--accent); flex-shrink: 0; font-size: 11px;
  }
  .review-table .day-cell .task-text {
    flex: 1; color: var(--text); word-break: break-word;
  }
  .review-table .day-cell .task-pri {
    font-size: 10px; font-weight: 700;
    margin-right: 2px;
  }
  .review-table .day-cell .task-pri.P0 { color: var(--p0); }
  .review-table .day-cell .task-pri.P1 { color: var(--p1); }
  .review-table .day-cell .task-pri.P2 { color: var(--p2); }
  .review-table .day-cell .task-pri.P3 { color: var(--p3); }
  .review-table .day-cell .task-time {
    font-size: 10px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .review-table .day-cell .empty-hint {
    color: var(--muted); font-size: 12px; font-style: normal;
  }
  .review-table .day-cell.future .empty-hint::before { content: "—"; }

  /* === 日期触发按钮（替代 input[type=date]） === */
  .due-btn {
    border: 1px solid var(--line); background: var(--surface);
    border-radius: 6px; padding: 5px 12px;
    font-size: 13px; color: var(--text);
    font-family: inherit; cursor: pointer; outline: none;
    display: inline-flex; align-items: center; gap: 4px;
    white-space: nowrap;
  }
  .due-btn:hover { border-color: var(--accent); background: var(--hover); }
  .due-btn.active { border-color: var(--accent); color: var(--accent); }
  .due-btn-sm { font-size: 11px; padding: 3px 8px; }

  /* === 自定义日期选择器 popover === */
  .date-picker {
    position: fixed; z-index: 300; max-height: calc(100vh - 16px); overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 10px 32px rgba(0,0,0,0.18);
    padding: 14px;
    width: 300px;
    font-size: 13px;
  }
  .dp-head {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 10px;
  }
  .dp-title {
    flex: 1; text-align: center;
    font-weight: 600; font-size: 14px;
    font-variant-numeric: tabular-nums;
  }
  .dp-nav {
    background: transparent; border: 1px solid var(--line);
    width: 28px; height: 28px; border-radius: 6px;
    cursor: pointer; color: var(--text-2);
    font-size: 14px; line-height: 1; padding: 0;
    font-family: inherit;
  }
  .dp-nav:hover:not(:disabled) { background: var(--hover); color: var(--text); }
  .dp-nav:disabled { opacity: 0.3; cursor: not-allowed; }

  .dp-grid {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 2px; margin-bottom: 4px;
  }
  .dp-dow {
    text-align: center; font-size: 11px;
    color: var(--muted); padding: 4px 0;
  }
  .dp-cell {
    text-align: center; padding: 8px 0;
    cursor: pointer; border-radius: 6px;
    font-variant-numeric: tabular-nums;
    user-select: none;
    font-size: 13px;
    transition: background 0.1s;
  }
  .dp-cell.muted { color: var(--muted); opacity: 0.35; pointer-events: none; }

<body>

<div class="view-header">

<script>
let state = { tasks: [], projects: [], milestones: [], people: [], weekly_report_groups: [] };
let lastUpdated = "";
let dirty = false;
let taskDrag = null;
let projectDrag = null;
let taskRangeDay=todayStr();
let taskTimeRange=localStorage.getItem('tracking-time-range')||'near';
if(localStorage.getItem('tracking-range-day')&&localStorage.getItem('tracking-range-day')!==taskRangeDay)taskTimeRange='near';
let taskSort=localStorage.getItem('tracking-task-sort')||'deadline';
let navTarget = null;
let navScrollFrame = null;

function navScrollOffset() {
  return document.querySelector(".app-toolbar").getBoundingClientRect().height;
}
const toolbarObserver = new ResizeObserver(() => {
  document.documentElement.style.setProperty("--toolbar-height", navScrollOffset() + "px");
  scheduleNavHighlight();
});
toolbarObserver.observe(document.querySelector(".app-toolbar"));

function highlightPriorityNav() {
  const toolbar = document.querySelector(".app-toolbar");
  toolbar.classList.toggle("is-stuck", toolbar.getBoundingClientRect().top <= 0);
  const groups = Array.from(document.querySelectorAll("#groups > .group"));
  if (navTarget && !groups.some(group => group.dataset.group === navTarget)) navTarget = null;
  let active = navTarget;
  if (!active && groups.length) {
    active = groups[0].dataset.group;
    const offset = navScrollOffset() + 12;
    for (const group of groups) {
      if (group.getBoundingClientRect().top <= offset) active = group.dataset.group;
    }
    if (scrollY > 0 && innerHeight + scrollY >= document.documentElement.scrollHeight - 2) {
      active = groups[groups.length - 1].dataset.group;
    }
  }
  document.querySelectorAll(".priority-link").forEach(button => {
    if (button.dataset.group === active) button.setAttribute("aria-current", "location");
    else button.removeAttribute("aria-current");
  });
}

function scheduleNavHighlight() {
  if (navScrollFrame !== null) return;
  navScrollFrame = requestAnimationFrame(() => {
    navScrollFrame = null;
    highlightPriorityNav();
  });
}

function renderPriorityNav(buckets) {
  const root = document.getElementById("priorityNav");
  const focused = root.contains(document.activeElement) ? document.activeElement.dataset.group : null;
  const entries = [
    ["P0", "P0 紧急", buckets.P0.length, "var(--p0)"],
    ["P1", "P1 重要", buckets.P1.length, "var(--p1)"],
    ["P2", "P2 一般", buckets.P2.length, "var(--p2)"],
  ];
  if (buckets.PN.length) entries.push(["PN", "未分类", buckets.PN.length, "var(--pn)"]);
  if (buckets.suggest.length) entries.unshift(["SG", "待采纳", buckets.suggest.length, "var(--accent)"]);
  entries.push(["DN", "今日完成", buckets.done.length, "var(--accent)"]);
  root.replaceChildren();
  for (const [key, label, count, color] of entries) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "priority-link";
    button.dataset.group = key;
    button.disabled = count === 0;
    button.setAttribute("aria-label", `${label}，${count} 件`);
    button.setAttribute("aria-controls", "group-" + key);
    button.innerHTML = `<span class="nav-dot" style="background:${color}"></span><span>${label}</span><span class="nav-count">${count}</span>`;
    button.addEventListener("click", () => {
      const group = document.getElementById("group-" + key);
      if (!group) return;
      if (group.classList.contains("collapsed")) {
        group.classList.remove("collapsed");
        localStorage.setItem("collapsed_" + key, "0");
      }
      navTarget = key;
      highlightPriorityNav();
      window.scrollTo({
        top: Math.max(0, scrollY + group.getBoundingClientRect().top - navScrollOffset()),
        behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"
      });
    });
    root.appendChild(button);
    if (focused === key && !button.disabled) button.focus({ preventScroll: true });
  }
  highlightPriorityNav();
}

window.addEventListener("scroll", scheduleNavHighlight, { passive: true });
window.addEventListener("resize", scheduleNavHighlight, { passive: true });
for (const event of ["wheel", "touchstart", "pointerdown"]) {
  window.addEventListener(event, () => { navTarget = null; }, { passive: true });
}
window.addEventListener("keydown", e => {
  if (["PageUp", "PageDown", "Home", "End", "ArrowUp", "ArrowDown", " "].includes(e.key)) navTarget = null;
});

function compareTaskOrder(a, b) {
  const aOrdered = Number.isFinite(a.sort_order);
  const bOrdered = Number.isFinite(b.sort_order);
  // Newly added tasks stay visible at the top until explicitly arranged.
  if (aOrdered !== bOrdered) return aOrdered ? 1 : -1;
  if (aOrdered && a.sort_order !== b.sort_order) return a.sort_order - b.sort_order;
  return timestampValue(b.created) - timestampValue(a.created);
}

async function persistTaskOrder(ul, original) {
  const ids = Array.from(ul.children, row => row.dataset.id);
  const projectId = ul.dataset.projectId;
  const payload = projectId ? {ids, scope:'project', project_id:projectId, milestone_id:ul.dataset.milestoneId || null} : {ids};
  const field = projectId ? 'project_sort_order' : 'sort_order';
  return mutate('/todos/reorder', 'POST', payload, () => {
    // Keep a successful move visible even if its follow-up refresh fails.
    ids.forEach((id, position) => {
      const task = state.tasks.find(task => task.id === id);
      if (task) task[field] = position;
    });
  }, () => {
    if (ul.isConnected && original) original.forEach(row => ul.appendChild(row));
  });
}

function addDragHandle(li, projectView = false) {
  const handle = document.createElement("button");
  handle.type = "button";
  handle.className = "drag-handle";
  handle.textContent = "⠿";
  handle.title = projectView || li.parentElement?.dataset.projectId || li.closest('#projectDetail')
    ? "拖动排序（同一里程碑）；也可用上下方向键"
    : "拖动排序（同一优先级）；也可用上下方向键";
  handle.setAttribute("aria-label", "拖动排序：" + li.querySelector(".text").textContent);
  handle.addEventListener("pointerdown", e => {
    if (e.button !== 0 || dirty || taskDrag) return;
    e.preventDefault();
    const ul = li.parentElement;
    handle.title = ul.dataset.projectId ? "拖动排序（同一里程碑）；也可用上下方向键" : "拖动排序（同一优先级）；也可用上下方向键";
    const box = li.getBoundingClientRect();
    const preview = li.cloneNode(true);
    preview.className = li.className + " task-drag-preview" + (ul.dataset.projectId ? " project-task-preview" : "");
    preview.removeAttribute("data-id");
    preview.setAttribute("aria-hidden", "true");
    preview.inert = true;
    Object.assign(preview.style, {
      left: box.left + "px", top: box.top + "px", width: box.width + "px",
      height: box.height + "px", boxSizing: "border-box"
    });
    document.body.appendChild(preview);
    li.classList.add("drag-placeholder");
    document.body.classList.add("task-dragging");
    taskDrag = { li, ul, handle, pointerId: e.pointerId, y: e.clientY,
      startX: e.clientX, startY: e.clientY, preview, box,
      moved: false, original: Array.from(ul.children), frame: null };
    document.body.setPointerCapture(e.pointerId);
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", up);
    document.addEventListener("pointercancel", cancelDrag);
    document.addEventListener("keydown", escapeDrag);
    document.body.addEventListener("lostpointercapture", cancelDrag);
    const scroll = () => {
      if (!taskDrag) return;
      const y = taskDrag.y;
      const delta = y < navScrollOffset() + 48 ? -12 : y > innerHeight - 70 ? 12 : 0;
      if (delta && taskDrag.moved) { window.scrollBy(0, delta); placeDraggedTask(y); }
      taskDrag.frame = requestAnimationFrame(scroll);
    };
    scroll();
  });
  const move = e => {
    if (!taskDrag || taskDrag.pointerId !== e.pointerId) return;
    taskDrag.y = e.clientY;
    taskDrag.preview.style.transform = `translate(${e.clientX - taskDrag.startX}px, ${e.clientY - taskDrag.startY}px) scale(1.015)`;
    if (!taskDrag.moved && Math.abs(e.clientY - taskDrag.startY) < 5) return;
    taskDrag.moved = true;
    placeDraggedTask(e.clientY);
  };
  const finish = (e, cancel = false) => {
    if (!taskDrag || taskDrag.pointerId !== e.pointerId) return;
    const drag = taskDrag;
    taskDrag = null;
    cancelAnimationFrame(drag.frame);
    li.classList.remove("drag-placeholder");
    document.body.classList.remove("task-dragging");
    document.removeEventListener("pointermove", move);
    document.removeEventListener("pointerup", up);
    document.removeEventListener("pointercancel", cancelDrag);
    document.removeEventListener("keydown", escapeDrag);
    document.body.removeEventListener("lostpointercapture", cancelDrag);
    if (document.body.hasPointerCapture(e.pointerId)) document.body.releasePointerCapture(e.pointerId);
    if (cancel) {
      drag.preview.remove();
      drag.original.forEach(row => drag.ul.appendChild(row));
      if (renderPending) requestRender();
      return;
    }
    const target = li.getBoundingClientRect();
    const landing = drag.preview.animate([
      { transform: drag.preview.style.transform || "none", opacity: 0.97 },
      { transform: `translate(${target.left - drag.box.left}px, ${target.top - drag.box.top}px)`, opacity: 0 }
    ], { duration: matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 140, easing: "ease-out", fill: "forwards" });
    landing.finished.finally(() => drag.preview.remove());
    const changed = drag.original.some((row, i) => drag.ul.children[i] !== row);
    if (changed) persistTaskOrder(drag.ul, drag.original);
    else if (renderPending) requestRender();
  };
  const up = e => finish(e);
  const cancelDrag = e => finish(e, true);
  const escapeDrag = e => {
    if (e.key === "Escape" && taskDrag) {
      e.preventDefault();
      finish({ pointerId: taskDrag.pointerId }, true);
    }
  };
  handle.addEventListener("keydown", async e => {
    if (!["ArrowUp", "ArrowDown"].includes(e.key) || dirty || taskDrag) return;
    e.preventDefault();
    const ul = li.parentElement;
    const neighbor = e.key === "ArrowUp" ? li.previousElementSibling : li.nextElementSibling;
    if (!neighbor) return;
    const original = Array.from(ul.children);
    ul.insertBefore(li, e.key === "ArrowUp" ? neighbor : neighbor.nextElementSibling);
    await persistTaskOrder(ul, original);
    const root = ul.dataset.projectId ? '#projectDetail' : '#groups';
    document.querySelectorAll(root + " li").forEach(row => {
      if (row.dataset.id === li.dataset.id) row.querySelector(".drag-handle")?.focus({preventScroll:true});
    });
  });
  li.prepend(handle);
}

function placeDraggedTask(y) {
  const { ul, li } = taskDrag;
  const rows = Array.from(ul.children).filter(row => row !== li);
  const next = rows.find(row => {
    const box = row.getBoundingClientRect();
    return y < box.top + box.height / 2;
  });
  if (li.nextElementSibling !== (next || null)) {
    const positions = new Map(rows.map(row => [row, row.getBoundingClientRect().top]));
    ul.insertBefore(li, next || null);
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
      rows.forEach(row => {
        row.getAnimations().forEach(animation => animation.cancel());
        const offset = positions.get(row) - row.getBoundingClientRect().top;
        if (offset) row.animate([
          { transform: `translateY(${offset}px)` }, { transform: "translateY(0)" }
        ], { duration: 140, easing: "ease-out" });
      });
    }
  }
}

const PRI_ORDER = ["P0", "P1", "P2"];
const PRI_LABEL = {
  P0: "紧急", P1: "重要", P2: "一般"
};
// Retired P3 records remain unchanged in storage and appear under 一般.
function visiblePriority(task) { return task.priority === 'P3' ? 'P2' : task.priority; }

function pad2(n) { return String(n).padStart(2, "0"); }
// UTC/offset timestamps are displayed in Beijing; legacy naive timestamps already mean Beijing.
function timestampDate(value) {
  if (!value) return null;
  const raw = String(value).replace(' ', 'T');
  const normalized = /^\d{4}-\d{2}-\d{2}$/.test(raw) ? raw + 'T00:00:00+08:00'
    : /(?:Z|[+-]\d{2}:?\d{2})$/i.test(raw) ? raw : raw + '+08:00';
  const date = new Date(normalized);
  return Number.isNaN(date.getTime()) ? null : date;
}
function timestampValue(value) { return timestampDate(value)?.getTime() || 0; }
function localDateKey(value) {
  const d = value instanceof Date ? value : timestampDate(value);
  if (!d || Number.isNaN(d.getTime())) return '';
  const parts = new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);
  const part = type => parts.find(p => p.type === type).value;
  return `${part('year')}-${part('month')}-${part('day')}`;
}
function localTime(value) {
  const d = value instanceof Date ? value : timestampDate(value);
  return d ? new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(d) : '';
}
function todayStr() { return localDateKey(new Date()); }
// Calendar-only Date objects carry the chosen calendar day, independent of the browser's time zone.
function calendarDate(key = todayStr()) {
  const [year,month,day] = key.split('-').map(Number);
  return new Date(year, month-1, day, 12, 0, 0);
}
function calendarKey(d) { return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function dateStrOffset(days) {
  const d = calendarDate(); d.setDate(d.getDate()+days); return calendarKey(d);
}
function fmtTime(iso) {
  const date = localDateKey(iso);
  return !date ? '' : date === todayStr() ? localTime(iso) : date.slice(5);
}
function fmtFull(iso) {
  const date = localDateKey(iso);
  return date ? date + ' ' + localTime(iso) : '';
}

// Shared inline task rows are defined below.

function renderGroup(key, label, labelCn, tasks, collapsible = false) {
  if (tasks.length === 0) return null;
  const g = document.createElement("div");
  g.className = "group " + key;
  g.id = "group-" + key;
  g.dataset.group = key;
  if (collapsible) {
    const saved = localStorage.getItem("collapsed_" + key);
    const collapsed = saved === null ? true : saved === "1";  // 默认折叠
    if (collapsed) g.classList.add("collapsed");
  }
  const head = document.createElement("div");
  head.className = "group-head" + (collapsible ? " collapsible" : "");
  head.innerHTML = `
    <span class="pri-dot"></span>
    <span class="label">${label}</span>
    <span class="label-cn">${labelCn}</span>
    <span class="count">${tasks.length}</span>
    ${collapsible ? '<span class="toggle">▾</span>' : ''}
  `;
  if (collapsible) {
    head.addEventListener("click", () => {
      g.classList.toggle("collapsed");
      localStorage.setItem("collapsed_" + key, g.classList.contains("collapsed") ? "1" : "0");
    });
  }
  const ul = document.createElement("ul");
  tasks.forEach(t => {
    const row = renderTask(t);
    if (taskSort==='manual'&&["P0", "P1", "P2", "PN"].includes(key)) addDragHandle(row);
    ul.appendChild(row);
  });
  g.append(head, ul);
  return g;
}

function isRecurringSeed(task) {
  return (
    ["daily", "weekly", "monthly"].includes(task.recurring)
    && !task.recur_source
  );
}

function taskDisplayDate(t){return t.deadline||(t.recur_source?localDateKey(t.created):'');}
function matchesTaskRange(t){
  const date=taskDisplayDate(t),today=todayStr();
  if(taskTimeRange==='all')return true;
  if(taskTimeRange==='overdue')return !!date&&date<today;
  if(taskTimeRange==='undated')return !date;
  return !!date&&date>=today&&date<=dateStrOffset(2);
}
function renderTaskControls(){
  const today=todayStr();
  if(today!==taskRangeDay){taskRangeDay=today;taskTimeRange='near';}
  localStorage.setItem('tracking-time-range',taskTimeRange);localStorage.setItem('tracking-range-day',today);
  const open=state.tasks.filter(t=>!t.deleted_at&&!t.done&&!isRecurringSeed(t));
  const range=document.getElementById('taskTimeRange');range.value=taskTimeRange;
  range.querySelector('[value=overdue]').textContent='逾期 ('+open.filter(t=>taskDisplayDate(t)&&taskDisplayDate(t)<today).length+')';
  range.querySelector('[value=undated]').textContent='未设截止 ('+open.filter(t=>!taskDisplayDate(t)).length+')';
  document.getElementById('taskSort').value=taskSort;
  document.getElementById('taskRangeHint').textContent=taskTimeRange==='near'?`${today.slice(5).replace('-','/')} — ${dateStrOffset(2).slice(5).replace('-','/')} · 含今天`:'';
}
for(const [id,update] of [['taskTimeRange',value=>{taskTimeRange=value;}],['taskSort',value=>{taskSort=value;localStorage.setItem('tracking-task-sort',value);} ]]){
  document.getElementById(id).addEventListener('change',e=>{update(e.target.value);e.target.blur();requestRender();});
}

function render() {
  const root = document.getElementById("groups");
  root.innerHTML = "";
  const today = todayStr();
  renderTaskControls();

  // 普通事项立即显示；重复任务模板只在「重复任务」中管理。
  const buckets = { suggest: [], P0: [], P1: [], P2: [], PN: [], done: [] };
  for (const t of state.tasks) {
    if (t.deleted_at) continue;
    if (isRecurringSeed(t)) continue;
    if (t.done) { if (t.done_at && localDateKey(t.done_at) === today) buckets.done.push(t); continue; }
    if (!matchesTaskRange(t)) continue;
    if (t.source === "claude-suggest") { buckets.suggest.push(t); continue; }  // Claude 建议隔离区，待 Ocean 审
    if (PRI_ORDER.includes(visiblePriority(t))) buckets[visiblePriority(t)].push(t);
    else buckets.PN.push(t);
  }
  for (const k of ["P0","P1","P2","PN"]) {
    buckets[k].sort(taskSort==='manual'?compareTaskOrder:(a,b)=>(taskDisplayDate(a)||'9999').localeCompare(taskDisplayDate(b)||'9999')||timestampValue(a.created)-timestampValue(b.created)||a.id.localeCompare(b.id));
  }
  buckets.suggest.sort((a, b) => timestampValue(b.created) - timestampValue(a.created));
  buckets.done.sort((a, b) => timestampValue(b.done_at) - timestampValue(a.done_at));

  if (buckets.suggest.length) {
    const g = renderGroup("SG", "💡", "Claude 建议", buckets.suggest);
    if (g) root.appendChild(g);
  }
  for (const k of PRI_ORDER) {
    const g = renderGroup(k, k, PRI_LABEL[k], buckets[k]);
    if (g) root.appendChild(g);
  }
  if (buckets.PN.length) {
    const g = renderGroup("PN", "—", "未分类", buckets.PN);
    if (g) root.appendChild(g);
  }
  if (buckets.done.length) {
    const g = renderGroup("DN", "✓", "今日完成", buckets.done, true);
    if (g) root.appendChild(g);
  }

  const nOpen = buckets.P0.length + buckets.P1.length + buckets.P2.length + buckets.PN.length;
  document.getElementById("meta").textContent =
    "更新 " + (state.updated || "—").replace("T", " ").slice(0, 16);

  if (nOpen === 0 && buckets.done.length === 0 && buckets.suggest.length === 0) {
    root.innerHTML = '<div class="empty">'+(taskTimeRange==='near'?'近3天暂无待办，可在「设置」中切换「全部待办」查看其他事项。':'当前范围暂无待办。')+'</div>';
  }

  // 弹窗打开时同步刷新模板列表，保留添加表单。
  renderPriorityNav(buckets);
  if (document.getElementById("recurringModal").classList.contains("show")) {
    renderRecurring();
  }
}

// ============== 版本检查 ==============
function cmpVer(a, b) {
  const pa = String(a).split(".").map(n => parseInt(n) || 0);
  const pb = String(b).split(".").map(n => parseInt(n) || 0);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    const x = pa[i] || 0, y = pb[i] || 0;
    if (x !== y) return x - y;
  }
  return 0;
}
function showToast(msg, ms = 2500, withProgress = false) {
  const t = document.getElementById("toast");
  document.getElementById("toastText").textContent = msg;
  t.classList.toggle("with-progress", withProgress);
  t.classList.add("show");
  clearTimeout(showToast._timer);
  if (ms > 0) {
    showToast._timer = setTimeout(() => t.classList.remove("show"), ms);
  }
}
function hideToast() {
  document.getElementById("toast").classList.remove("show");
  clearTimeout(showToast._timer);
}
function setToastProgress(percent) {
  document.getElementById("toastBar").style.width = Math.max(0, Math.min(100, percent)) + "%";
}
function fmtSize(bytes) {
  if (!bytes) return "0";
  const mb = bytes / 1024 / 1024;
  return mb < 10 ? mb.toFixed(1) + " MB" : Math.round(mb) + " MB";
}

async function checkUpdate(verbose = false) {
  if (verbose) showToast("⏳ 检查中…", 8000);
  let data;
  try {
    const r = await fetch("/check-update", { cache: "no-store" });
    data = await r.json();
  } catch (e) {
    if (verbose) showToast("❌ 检查失败：server 无响应");
    return;
  }
  if (data.branch_build) {
    if (verbose) showToast(data.message || "当前为项目跟进分支版", 4000);
    return;
  }
  if (data.error) {
    if (verbose) {
      const hint = data.has_token ? "" : "（未配 .gh-token）";
      showToast(`❌ ${data.error.slice(0, 60)} ${hint}`);
    }
    return;
  }
  const me = data.current;
  const latest = data.latest;
  if (!latest) {
    if (verbose) showToast("❌ 远端 release 不存在");
    return;
  }
  if (cmpVer(latest, me) > 0) {
    if (verbose) localStorage.removeItem("dismissedVer");
    if (localStorage.getItem("dismissedVer") !== latest) {
      const banner = document.getElementById("updateBanner");
      document.getElementById("updateVer").textContent = "v" + latest;
      banner.classList.add("show");
      banner.dataset.url = data.html_url;
      banner.dataset.ver = latest;
    }
    if (verbose) showToast(`🆕 发现新版本 v${latest}`);
  } else {
    if (verbose) showToast(`✅ 已是最新 v${me}`);
  }
}
document.getElementById("updateView").addEventListener("click", () => {
  const url = document.getElementById("updateBanner").dataset.url;
  if (url) window.open(url, "_blank");
});

async function pollUpdateProgress() {
  while (true) {
    let p;
    try {
      const r = await fetch("/update-progress", { cache: "no-store" });
      p = await r.json();
    } catch (e) {
      // server 自杀后 fetch fail：updater 接管中
      showToast("✅ App 即将重启…", 6000, false);
      setToastProgress(100);
      return;
    }
    if (p.status === "error") {
      showToast("❌ 更新失败：" + (p.error || "").slice(0, 80), 6000, false);
      return;
    }
    if (p.status === "downloading") {
      const pct = p.total > 0 ? Math.floor(p.downloaded / p.total * 100) : 0;
      const txt = `⬇ 下载中 ${pct}% · ${fmtSize(p.downloaded)} / ${fmtSize(p.total)}`;
      showToast(txt, 0, true);
      setToastProgress(pct);
    } else if (p.status === "downloaded" || p.status === "installing") {
      showToast("⚙️ 安装中…", 0, true);
      setToastProgress(100);
    } else if (p.status === "restarting") {
      showToast("✅ App 即将重启…", 6000, false);
      setToastProgress(100);
      return;
    }
    await new Promise(r => setTimeout(r, 400));
  }
}

// ============== 周复盘 ==============
const DOW = ["一", "二", "三", "四", "五", "六", "日"];
let viewWeekStart = null;  // 当前查看的周（周一日期对象）

function getMonday(d) {
  const x = new Date(d);
  x.setHours(0, 0, 0, 0);
  const day = x.getDay() || 7;  // 周日 = 7
  x.setDate(x.getDate() - (day - 1));
  return x;
}
function getWeekKey(d) {
  // ISO 周编号
  const date = new Date(d);
  date.setHours(0, 0, 0, 0);
  date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
  const week1 = new Date(date.getFullYear(), 0, 4);
  const wnum = 1 + Math.round(((date - week1) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
  return { year: date.getFullYear(), week: wnum };
}
function fmtMD(d) {
  return `${d.getMonth() + 1}/${d.getDate()}`;
}
function isSameDay(a, b) {
  return a.getFullYear() === b.getFullYear() &&
         a.getMonth() === b.getMonth() &&
         a.getDate() === b.getDate();
}
function earliestMonday() {
  const dates = state.tasks.filter(t => !t.deleted_at).map(t => t.created).filter(Boolean).sort((a,b) => timestampValue(a) - timestampValue(b));
  if (!dates.length) return getMonday(calendarDate());
  return getMonday(calendarDate(localDateKey(dates[0])));
}

function tasksOnDate(d) {
  return state.tasks.filter(t => {
    if (t.deleted_at || !t.done || !t.done_at) return false;
    return localDateKey(t.done_at) === calendarKey(d);
  });
}

function heatLevel(n) {
  if (n === 0) return "l0";
  if (n === 1) return "l1";
  if (n <= 2) return "l2";
  if (n <= 4) return "l3";
  return "l4";
}

function renderReview() {
  if (!viewWeekStart) viewWeekStart = getMonday(calendarDate());
  const today = calendarDate(); today.setHours(0,0,0,0);
  const thisWeek = getMonday(today);
  const earliest = earliestMonday();

  // 周 label
  const wk = getWeekKey(viewWeekStart);
  const sun = new Date(viewWeekStart);
  sun.setDate(sun.getDate() + 6);
  document.getElementById("weekLabel").textContent =
    `${wk.year} W${String(wk.week).padStart(2,"0")} · ${fmtMD(viewWeekStart)} - ${fmtMD(sun)}`;

  // 导航按钮 enable/disable
  document.getElementById("weekPrev").disabled = viewWeekStart <= earliest;
  document.getElementById("weekNext").disabled = viewWeekStart >= thisWeek;

  // 收集 7 天数据
  const days = [];
  let weekTotal = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date(viewWeekStart);
    d.setDate(d.getDate() + i);
    const tasks = tasksOnDate(d);
    weekTotal += tasks.length;
    days.push({ date: d, tasks, isFuture: d > today, isToday: isSameDay(d, today) });
  }

  // 渲染单个 day cell 内容
  function dayHTML(idx) {
    const { date, tasks, isFuture, isToday } = days[idx];
    const cls = "day-cell" + (isFuture ? " future" : "") + (isToday ? " today" : "");
    const head = `
      <div class="day-head">
        <span class="dow">周${DOW[idx]} 完成</span>
        <span class="ddate">${fmtMD(date)} · ${tasks.length}件</span>
      </div>`;
    let body;
    if (isFuture) {
      body = `<div class="empty-hint"></div>`;
    } else if (tasks.length === 0) {
      body = `<div class="empty-hint">（无）</div>`;
    } else {
      const lis = tasks.map(t => {
        const time = localTime(t.done_at);
        const priority = visiblePriority(t);
        const pri = priority ? `<span class="task-pri ${escapeHtml(priority)}">${escapeHtml(priority)}</span>` : "";
        return `<li>
          <span class="check">✓</span>
          ${pri}
          <span class="task-text">${escapeHtml(t.text)}</span>
          <span class="task-time">${time}</span>
        </li>`;
      }).join("");
      body = `<ul>${lis}</ul>`;
    }
    return `<td class="${cls}">${head}${body}</td>`;
  }

  // 装表：colgroup 锁列宽 → 第一行汇总（colspan=3）→ 2-3 行各 3 天 → 4 行周日 + colspan=2 空
  const html = `
    <table class="review-table">
      <colgroup>
        <col style="width:33.33%">
        <col style="width:33.33%">
        <col style="width:33.34%">
      </colgroup>
      <tr class="summary-row">

function fmtDueShort(dateStr) {
  // 输入 "YYYY-MM-DD"；输出 "今天/明天/N天后/M/D"
  if (!dateStr) return "今天";
  const today = todayStr();
  if (dateStr <= today) return "今天";
  const tD = new Date(today + "T00:00:00");
  const dD = new Date(dateStr + "T00:00:00");
  const days = Math.round((dD - tD) / 86400000);
  if (days === 1) return "明天";
  if (days <= 7) return `${days}天后`;
  const [, m, d] = dateStr.split("-").map(Number);
  return `${m}/${d}`;
}

function openDatePicker(anchor, currentValue, onConfirm, {allowEmpty=false,label='截止日期'}={}) {

    for(let d=1;d<=last;d++){

function setupDateInput(input,label='截止日期'){

async function addRecurSeed(text, priority, tag, recurring, weekday, monthday) {
  const payload = {text, priority, tag, recurring, source:'user'};
  if (recurring === 'weekly') payload.recur_weekday = Number(weekday);
  if (recurring === 'monthly') payload.recur_monthday = Number(monthday);
  const ok = await mutate('/recurring/add', 'POST', payload);
  if (!ok) throw new Error('添加重复任务失败，输入已保留');
  await mutate('/ensure-recurring', 'POST');
}

function deleteRecurSeed(seedId) {
  const seed = state.tasks.find(t => t.id === seedId);
  if (!seed) return;
  const hasInstances = state.tasks.some(t => t.recur_source === seedId);
  const msg = hasInstances
    ? "删除重复任务模板？\n已生成的历史实例（含未完成的）会保留为普通任务。"
    : "删除重复任务模板？";
  if (!confirm(msg)) return;
  return mutate("/todos/" + encodeURIComponent(seedId), "DELETE");
}

  const addInput = root.querySelector("#recurNewText");
  const frequency = root.querySelector("#recurNewFrequency");

  const errorText = root.querySelector("#recurError");
  monthday.innerHTML = Array.from(
    { length: 31 }, (_, index) => `<option value="${index + 1}">${index + 1} 日</option>`
  ).join("");
  monthday.value = "13";
  function syncScheduleControls() {
    weekday.parentElement.hidden = frequency.value !== "weekly";
    monthday.parentElement.hidden = frequency.value !== "monthly";
  }
  frequency.addEventListener("change", syncScheduleControls);
  syncScheduleControls();

    const showing = form.classList.toggle("show");
    toggle.textContent = showing ? "收起" : "＋ 添加重复任务";
    toggle.setAttribute("aria-expanded", String(showing));
    if (showing) addInput.focus();
  });

    e.preventDefault();
    if (form.dataset.saving === 'true') return;
    const text = addInput.value.trim();
    if (!text) { addInput.focus(); return; }
    errorText.textContent = '';
    form.dataset.saving = 'true';
    const controls = [...form.querySelectorAll('input,select,button')];
    controls.forEach(n => n.disabled = true);
    addBtn.textContent = '添加中…';
    try {
      await addRecurSeed(text, root.querySelector("#recurNewPri").value,
        root.querySelector("#recurNewTag").value, frequency.value, weekday.value, monthday.value);
      addInput.value = "";
    } catch (error) {
      errorText.textContent = error.message || "添加重复任务失败，输入已保留";
    } finally {
      form.dataset.saving = 'false';
      controls.forEach(n => n.disabled = false);
      addBtn.textContent = '添加';
      if (document.getElementById('recurringModal').classList.contains('show')) addInput.focus();
    }
  });
  root.querySelector('#recurSeeds').addEventListener('click', async e => {
    const button = e.target.closest('[data-action="del-seed"]');
    if (!button || button.disabled) return;
    button.disabled = true;
    try { await deleteRecurSeed(button.dataset.id); }
    finally { button.disabled = false; }
  });
}

<script>

async function readState(force = false) {

  if (!r.ok) throw new Error('无法读取数据');
  const data = await r.json();
  if (generation !== readGeneration || (!force && mutationCount)) return;

function patchTask(id, patch, success) { return mutate('/todos/' + encodeURIComponent(id), 'PATCH', patch, success); }

function acceptSuggest(id) { return patchTask(id, {source:'claude'}); }

function projectById(id) { return state.projects.find(p => p.id === id); }
function milestoneById(id) { return state.milestones.find(m => m.id === id); }
function normalTask(t) { return !t.deleted_at && !t.recurring && !t.recur_source && !t.auto_skipped && t.source !== 'claude-suggest'; }
function projectTasks(p) { return state.tasks.filter(t => normalTask(t) && t.project_id === p.id); }
function projectMilestones(p) {
  return state.milestones.filter(m => m.project_id === p.id && !m.deleted_at)
    .sort((a,b) => (a.sort_order ?? 1e9) - (b.sort_order ?? 1e9) || timestampValue(a.created) - timestampValue(b.created) || a.id.localeCompare(b.id));
}
function milestoneTasks(m) { return state.tasks.filter(t => normalTask(t) && t.project_id === m.project_id && t.milestone_id === m.id); }
function milestoneComplete(m) { const ts = milestoneTasks(m); return ts.length > 0 && ts.every(t => t.done); }
function projectComplete(p) {
  const tasks=projectTasks(p);
  return tasks.length>0 && tasks.every(t=>t.done) && projectMilestones(p).every(milestoneComplete);
}
function completedProjects() { return state.projects.filter(p=>!p.deleted_at&&!p.archived&&projectComplete(p)); }
function nextOrder(a,b) { return (a.deadline || '9999').localeCompare(b.deadline || '9999') || timestampValue(a.created) - timestampValue(b.created) || a.id.localeCompare(b.id); }
function projectProgress(p) {
  const ts = projectTasks(p), ms = projectMilestones(p);
  const current = ms.find(m => !milestoneComplete(m));
  const next = (current ? milestoneTasks(current) : ts).filter(t => !t.done).sort(nextOrder)[0];
  return {tasks:ts, milestones:ms, current, next, done:ts.filter(t => t.done).length,
    milestonesDone:ms.filter(milestoneComplete).length,
    overdue:ts.filter(t => !t.done && t.deadline && t.deadline < todayStr()).length};
}
function associationValue(t) {
  const p = projectById(t.project_id);
  if (!t.project_id && !t.milestone_id) return '';
  // A retained, temporarily hidden link differs from an explicit unlink choice.
  if (!p || p.deleted_at) return 'retained:' + JSON.stringify({kind:'project', project_id:t.project_id, milestone_id:t.milestone_id});
  const m = milestoneById(t.milestone_id);
  if (t.milestone_id && (!m || m.deleted_at || m.project_id !== p.id)) {
    return 'retained:' + JSON.stringify({kind:'milestone', project_id:p.id, milestone_id:t.milestone_id});
  }
  return JSON.stringify([p.id, m ? m.id : null]);
}

function associationPatch(value) {
  const [project_id,milestone_id] = value ? JSON.parse(value) : [null,null];
  return {project_id,milestone_id};
}
function fillAssociation(select, value = '') {
  select.replaceChildren();
  const option = (v,label,disabled=false) => {const o=el('option','',label);o.value=v;o.disabled=disabled;select.appendChild(o);};
  if (value.startsWith('retained:')) {
    const retained = JSON.parse(value.slice('retained:'.length));
    option(value, retained.kind === 'project' ? '项目已删除' : '待安排 · 里程碑已删除', true);
  }
  option('', '不关联项目');
  const projects = state.projects.filter(p => !p.deleted_at).sort((a,b) => Number(!!b.core)-Number(!!a.core) || a.name.localeCompare(b.name));
  for (const p of projects) {
    const suffix = p.archived ? '（已归档）' : '';
    option(JSON.stringify([p.id,null]), p.name + suffix + ' · 待安排');
    for (const m of projectMilestones(p)) option(JSON.stringify([p.id,m.id]), p.name + suffix + ' · ' + m.name);
  }
  select.value = value; select.dataset.empty = String(!value);
  select.title = select.selectedOptions[0]?.textContent || '所属项目和里程碑';
}
function rowField(t, field, tag, type, fallback) {
  const key = t.id + ':' + field;
  const draft = fieldDrafts.get(key);
  const value = draft?.value ?? t[field] ?? fallback ?? '';
  const n = el(tag, field === 'text' ? 'text' : field + '-input');
  if (tag === 'input') {n.type=type || 'text';n.value=value;}
  else {n.contentEditable='true';n.textContent=value;n.setAttribute('role','textbox');}
  const labels = {text:'事项名称',owner:'负责人',deadline:'截止日期'};
  n.setAttribute('aria-label', labels[field]); n.title = labels[field];
  n.dataset.field = field;
  if (draft?.failed) n.classList.add('save-failed');
  const currentValue = () => tag === 'input' ? n.value : n.textContent;
  n.addEventListener('input', () => { fieldDrafts.set(key,{value:currentValue(),failed:false});n.classList.remove('save-failed'); });
  let savingValue;
  async function commit() {
    const raw = currentValue(); const value = field==='owner'?ownerNames(raw).join('、'):raw.trim();
    const prior = state.tasks.find(task => task.id === t.id)?.[field] ?? fallback ?? '';
    if (value === prior) {fieldDrafts.delete(key);return;}
    if (!value) {
      fieldDrafts.set(key,{value:raw,failed:true});n.classList.add('save-failed');
      status(labels[field] + '不能为空；输入保留在原行。',true); return;
    }
    if (value === savingValue) return;
    savingValue=value;
    const submittedDraft = {value,failed:false};
    fieldDrafts.set(key,submittedDraft);
    const ok = await patchTask(t.id,{[field]:value},() => {
      if (fieldDrafts.get(key) === submittedDraft) fieldDrafts.delete(key);
    });
    if (!ok && fieldDrafts.get(key) === submittedDraft) {
      fieldDrafts.set(key,{value:raw,failed:true});
      if (n.isConnected && currentValue().trim() === value) n.classList.add('save-failed');
      requestRender();
    }
    savingValue=undefined;
  }
  n.addEventListener('blur',()=>{if(field==='owner'&&activePersonPicker?.input===n)return;commit();});
  // Native date pickers and selects can retain focus after choosing; commit the selected value.
  if (field === 'deadline') n.addEventListener('change',commit);
  n.addEventListener('keydown',e => {
    if (e.key === 'Enter' && !e.isComposing) {e.preventDefault();n.blur();}
    if (e.key === 'Escape') {
      fieldDrafts.delete(key);
      if (tag === 'input') n.value=t[field] ?? fallback ?? ''; else n.textContent=t[field] ?? '';
      n.classList.remove('save-failed');n.blur();requestRender();
    }
  });
  if (field === 'text') n.addEventListener('paste',e => {
    e.preventDefault(); const text = e.clipboardData.getData('text/plain').replace(/\s*\n\s*/g,' ');
    document.execCommand('insertText',false,text);
  });
  return n;
}
function renderTask(t, {projectView=false}={}) {
  const li = el('li','inline-task' + (t.done?' done':'') + (t.auto_skipped?' auto-skipped':''));
  li.dataset.id=t.id;
  let lead;
  if(t.source==='claude-suggest') {
    li.classList.add('suggest'); lead=btn('✓ 采纳',()=>acceptSuggest(t.id),'accept-lead');
  } else {
    lead=el('input');lead.type='checkbox';lead.checked=!!t.done;lead.setAttribute('aria-label','完成：'+t.text);
    lead.addEventListener('change',async()=>{
      const checked=lead.checked;li.classList.toggle('done',checked);
      const ok=await toggleTask(t.id,checked);
      if(!ok) {lead.checked=!!t.done;li.classList.toggle('done',!!t.done);}
    });
  }
  const text=rowField(t,'text','div');
  text.title=[t.note,t.tag?('分类：'+t.tag):'',t.auto_skipped?'自动跳过，未实际完成':'',t.created?('添加：'+fmtFull(t.created)):'',t.done_at?('完成：'+fmtFull(t.done_at)):''].filter(Boolean).join('\n');
  const owner=rowField(t,'owner','input','text','Ocean');
  owner.autocomplete='off';owner.title=owner.value;
  const dateWrap=el('span','deadline-wrap');
  const dateKey=t.id+':deadline',dateDraft=fieldDrafts.get(dateKey);
  const deadlineValue=dateDraft?.value??t.deadline??'';
  const deadline=btn(deadlineValue?deadlineValue.replaceAll('-','/'):'设置日期',()=>{
    openDatePicker(deadline,fieldDrafts.get(dateKey)?.value??t.deadline??'',async value=>{
      const draft={value,failed:false};fieldDrafts.set(dateKey,draft);
      const ok=await patchTask(t.id,{deadline:value},()=>{if(fieldDrafts.get(dateKey)===draft)fieldDrafts.delete(dateKey);});
      if(!ok&&fieldDrafts.get(dateKey)===draft)fieldDrafts.set(dateKey,{value,failed:true});
      return ok;
    });
  },'deadline-input deadline-button');
  deadline.dataset.field='deadline';deadline.setAttribute('aria-label','截止日期');deadline.setAttribute('aria-haspopup','dialog');deadline.setAttribute('aria-expanded','false');
  deadline.classList.toggle('save-failed',!!dateDraft?.failed);
  dateWrap.classList.toggle('empty-date',!deadlineValue);
  deadline.title='截止日期 · '+(deadlineValue||'未设截止');
  dateWrap.append(deadline);
  let association,associationField;
  if(!projectView) {
    association=el('select','association');association.setAttribute('aria-label','所属项目和里程碑');
    fillAssociation(association,associationValue(t));
    association.disabled=!!(t.recurring||t.recur_source||t.auto_skipped);
    if(association.disabled) association.title='重复任务暂不关联项目';
    association.addEventListener('change',async()=>{
      const value=association.value;
      if(!await patchTask(t.id,associationPatch(value))) {association.value=associationValue(t);}
      association.blur();
    });
    associationField=el('span','association-field');
    const project=projectById(t.project_id),projectName=project&&!project.deleted_at?project.name:'不关联项目';
    const label=el('span','association-project-label'+(projectName==='不关联项目'?' unassigned':''),projectName);label.setAttribute('aria-hidden','true');
    associationField.append(association,label);
  }
  const pri=el('select','pri-select');pri.setAttribute('aria-label','优先级');pri.title='优先级';
  for(const v of ['P0','P1','P2','']) {const o=el('option','',v||'—');o.value=v;pri.appendChild(o);}
  pri.value=visiblePriority(t)||'';pri.addEventListener('change',async()=>{if(!await setPriority(t.id,pri.value||null))pri.value=visiblePriority(t)||'';pri.blur();});
  li.append(lead,text,personPicker(owner,true),dateWrap,...(associationField?[associationField]:[]),pri);
  const del=btn(t.source==='claude-suggest'?'拒绝':'×',()=>deleteTask(t.id),'row-delete');del.title='删除事项';del.setAttribute('aria-label','删除事项：'+t.text);li.append(del);
  return li;
}

  renderProjectList();renderProjectDetail();renderCoreSummary();renderPeopleOptions();

function applyTab() {
  document.getElementById('thingsView').hidden=activeTab!=='things';
  document.getElementById('projectsView').hidden=activeTab!=='projects';
  document.getElementById('newTaskForm').hidden=activeTab!=='things';
  document.querySelector('.app-toolbar').hidden=activeTab!=='things';
  document.getElementById('taskViewSettings').hidden=activeTab!=='things';
  document.getElementById('coreSummary').hidden=activeTab!=='things';
  for(const tab of document.querySelectorAll('[data-tab]')) {
    tab.setAttribute('aria-selected',String(tab.dataset.tab===activeTab));
    tab.tabIndex=tab.dataset.tab===activeTab?0:-1;

}
function switchTab(tab) {
  activeTab=tab;localStorage.setItem('tracking-tab',tab);applyTab();requestRender();
}
for(const tab of document.querySelectorAll('[data-tab]')) {
  tab.addEventListener('click',()=>switchTab(tab.dataset.tab));
  tab.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();switchTab(activeTab==='things'?'projects':'things');document.getElementById(activeTab+'Tab').focus();}});
}
function renderCoreSummary() {
  const root=document.getElementById('coreSummary');root.replaceChildren();
  const projects=visibleProjects().filter(p=>p.core);
  if(!projects.length)return;
  const cards=el('div','core-summary-cards');root.append(cards);
  for(const p of projects) {
    const progress=projectProgress(p);
    const summary=btn('',()=>{selectedProject=p.id;switchTab('projects');});
    const first=el('div','core-summary-line');
    first.append(el('b','',p.name),el('span','',progress.tasks.length?`事项已完成 ${progress.done}/${progress.tasks.length} 件`:'尚未添加事项'));
    if(progress.overdue)first.append(el('span','overdue-text',progress.overdue+' 件逾期'));
    const second=el('div','core-summary-line');
    second.append(el('span','',`当前里程碑：${progress.current?.name || (progress.milestones.length?'全部完成':'尚未添加')}`));
    second.append(el('span','','下一步：'+(progress.next?.text||(progress.current?'为当前里程碑添加事项':progress.milestones.length?'暂无待办':'添加第一个里程碑'))));
    summary.append(first,second);summary.title='查看项目：'+p.name;cards.append(summary);
  }
}
function visibleProjects() {
  return state.projects.filter(p=>!p.deleted_at&&!p.archived&&!projectComplete(p))
    .sort((a,b)=>(Number.isFinite(a.sort_order)?a.sort_order:Infinity)-(Number.isFinite(b.sort_order)?b.sort_order:Infinity)||Number(!!b.core)-Number(!!a.core)||(a.created||'').localeCompare(b.created||'')||a.name.localeCompare(b.name)||a.id.localeCompare(b.id));
}
function renderProjectList() {
  const root=document.getElementById('projectList');root.replaceChildren();
  const ps=visibleProjects();
  const viewed=projectById(viewingCompletedProject);
  if(!viewed||viewed.deleted_at||viewed.archived||!projectComplete(viewed))viewingCompletedProject='';
  if(!ps.some(p=>p.id===selectedProject)&&!(viewingCompletedProject&&selectedProject===viewingCompletedProject))selectedProject=ps[0]?.id||'';
  for(const p of ps) {
    const progress=projectProgress(p);
    const b=btn('',()=>{viewingCompletedProject='';selectedProject=p.id;localStorage.setItem('tracking-project',p.id);renderProjectList();renderProjectDetail();},'project-item');
    b.dataset.projectId=p.id;b.setAttribute('aria-current',String(p.id===selectedProject));
    bindProjectContextEdit(b,p.id);
    bindProjectDrag(b);
    b.append(el('strong','',(p.core?'★ ':'')+p.name),el('small','',(p.owner||'Ocean')+(progress.tasks.length?` · ${progress.done}/${progress.tasks.length} 项完成`:'')));root.appendChild(b);
  }
  if(!ps.length)root.append(el('p','project-hint','暂无进行中的项目'));
}

async function persistProjectOrder(root,original) {
  const ids=Array.from(root.children,row=>row.dataset.projectId);
  return mutate('/projects/reorder','POST',{ids},()=>{
    ids.forEach((id,order)=>{const p=projectById(id);if(p)p.sort_order=order;});
  },()=>{if(root.isConnected)original.forEach(row=>root.append(row));});
}
function bindProjectDrag(item) {
  item.title='拖动调整项目顺序；Alt + 上下方向键排序；右键编辑或删除';
  item.setAttribute('aria-keyshortcuts','Alt+ArrowUp Alt+ArrowDown');
  let suppressClick=false;
  item.addEventListener('click',e=>{if(suppressClick){e.preventDefault();e.stopImmediatePropagation();}},true);
  item.addEventListener('pointerdown',e=>{
    if(e.button!==0||dirty||taskDrag||projectDrag||isEditing())return;
    projectDrag={item,root:item.parentElement,pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,y:e.clientY,
      original:Array.from(item.parentElement.children),moved:false,preview:null,frame:null};
    document.addEventListener('pointermove',move,{passive:false});
    document.addEventListener('pointerup',up);
    document.addEventListener('pointercancel',cancel);
    document.addEventListener('keydown',escape);
    document.body.addEventListener('lostpointercapture',cancel);
  });
  function place(y){
    const d=projectDrag;if(!d)return;
    const next=Array.from(d.root.children).find(row=>row!==item&&y<row.getBoundingClientRect().top+row.getBoundingClientRect().height/2);
    if(item.nextElementSibling!==(next||null))d.root.insertBefore(item,next||null);
  }
  function autoScroll(){
    const d=projectDrag;if(!d)return;
    const box=d.root.getBoundingClientRect();
    const delta=d.y<Math.max(0,box.top)+32?-10:d.y>Math.min(innerHeight,box.bottom)-32?10:0;
    if(delta){d.root.scrollTop+=delta;place(d.y);}
    d.frame=requestAnimationFrame(autoScroll);
  }
  function move(e){
    const d=projectDrag;if(!d||d.item!==item||d.pointerId!==e.pointerId)return;
    d.y=e.clientY;
    if(!d.moved){
      if(Math.hypot(e.clientX-d.startX,e.clientY-d.startY)<6)return;
      d.moved=true;closeProjectContextMenu();
      const box=item.getBoundingClientRect(),preview=item.cloneNode(true);d.preview=preview;
      preview.classList.add('project-drag-preview');preview.removeAttribute('data-project-id');preview.setAttribute('aria-hidden','true');preview.inert=true;
      Object.assign(preview.style,{left:box.left+'px',top:box.top+'px',width:box.width+'px',height:box.height+'px'});
      document.body.append(preview);item.classList.add('project-drag-placeholder');document.body.classList.add('project-dragging');
      document.body.setPointerCapture(e.pointerId);autoScroll();
    }
    e.preventDefault();d.preview.style.transform=`translate(${e.clientX-d.startX}px,${e.clientY-d.startY}px)`;place(e.clientY);
  }
  function finish(e,canceled=false){
    const d=projectDrag;if(!d||d.item!==item||d.pointerId!==e.pointerId)return;
    projectDrag=null;cancelAnimationFrame(d.frame);
    document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);
    document.removeEventListener('pointercancel',cancel);document.removeEventListener('keydown',escape);document.body.removeEventListener('lostpointercapture',cancel);
    if(document.body.hasPointerCapture(e.pointerId))document.body.releasePointerCapture(e.pointerId);
    item.classList.remove('project-drag-placeholder');document.body.classList.remove('project-dragging');d.preview?.remove();
    if(d.moved){suppressClick=true;setTimeout(()=>{suppressClick=false;},0);}
    if(canceled){d.original.forEach(row=>d.root.append(row));if(renderPending)requestRender();return;}
    const changed=d.original.some((row,i)=>d.root.children[i]!==row);
    if(changed)persistProjectOrder(d.root,d.original);
    else if(renderPending)requestRender();
  }
  const up=e=>finish(e),cancel=e=>finish(e,true);
  const escape=e=>{if(e.key==='Escape'&&projectDrag){e.preventDefault();finish({pointerId:projectDrag.pointerId},true);}};
  item.addEventListener('keydown',async e=>{
    if(!e.altKey||!['ArrowUp','ArrowDown'].includes(e.key)||dirty||projectDrag||taskDrag)return;
    e.preventDefault();const root=item.parentElement,neighbor=e.key==='ArrowUp'?item.previousElementSibling:item.nextElementSibling;if(!neighbor)return;
    const original=Array.from(root.children);root.insertBefore(item,e.key==='ArrowUp'?neighbor:neighbor.nextElementSibling);
    await persistProjectOrder(root,original);
    Array.from(document.querySelectorAll('#projectList .project-item')).find(row=>row.dataset.projectId===item.dataset.projectId)?.focus({preventScroll:true});
  });
}

function bindProjectContextEdit(node, projectId) {
  node.title='右键打开项目菜单';
  const open=e=>{
    const project=projectById(projectId);
    if(!project||project.deleted_at)return;
    e.preventDefault();e.stopPropagation();
    openProjectContextMenu(node,projectId,e);
  };
  node.addEventListener('contextmenu',open);
  node.addEventListener('keydown',e=>{
    if(e.key==='ContextMenu'||(e.shiftKey&&e.key==='F10'))open(e);
  });
}
let projectContextAnchor=null;
function closeProjectContextMenu(restoreFocus=false) {
  const menu=document.getElementById('projectContextMenu');
  if(menu.hidden)return;
  menu.hidden=true;
  if(restoreFocus&&projectContextAnchor?.isConnected)projectContextAnchor.focus({preventScroll:true});
  projectContextAnchor=null;
}
function deleteProjectById(id) {
  const p=projectById(id);
  if(!p||p.deleted_at)return;
  if(confirm('删除「'+p.name+'」？\n项目会隐藏，可在项目设置中恢复；事项仍保留在事情跟进中。'))mutate('/projects/'+encodeURIComponent(id),'DELETE');
}
function openProjectContextMenu(anchor,id,event,kind='project') {
  closeProjectContextMenu();
  projectContextAnchor=anchor;
  const menu=document.getElementById('projectContextMenu');menu.replaceChildren();
  menu.setAttribute('aria-label',kind==='milestone'?'里程碑操作':'项目操作');
  const edit=btn('编辑',()=>{
    closeProjectContextMenu();
    if(kind==='milestone'){
      const m=milestoneById(id),p=m&&projectById(m.project_id);if(m&&!m.deleted_at&&p&&!p.deleted_at)openEntity('milestone',m,p);
    }else{const p=projectById(id);if(p&&!p.deleted_at)openEntity('project',p);}
  });
  const remove=btn('删除',()=>{closeProjectContextMenu();if(kind==='milestone')deleteMilestoneById(id);else deleteProjectById(id);},'danger');
  for(const button of [edit,remove])button.setAttribute('role','menuitem');
  menu.append(edit,remove);menu.hidden=false;
  const box=anchor.getBoundingClientRect();
  const pointer=event.type==='contextmenu'&&(event.clientX||event.clientY);

  menu.style.left=Math.max(8,Math.min(x,innerWidth-menu.offsetWidth-8))+'px';
  menu.style.top=Math.max(8,Math.min(y,innerHeight-menu.offsetHeight-8))+'px';
  edit.focus({preventScroll:true});
}
function deleteMilestoneById(id){
  const m=milestoneById(id),p=m&&projectById(m.project_id);
  if(!m||m.deleted_at||!p||p.deleted_at)return;
  if(confirm('删除「'+m.name+'」？\n事项会保留在「待安排」，里程碑可恢复。'))mutate('/milestones/'+encodeURIComponent(id),'DELETE');
}
function bindMilestoneContextMenu(header,heading,id){
  const open=e=>{const m=milestoneById(id);if(!m||m.deleted_at)return;e.preventDefault();e.stopPropagation();openProjectContextMenu(heading,id,e,'milestone');};
  header.addEventListener('contextmenu',open);
  heading.addEventListener('keydown',e=>{if(e.key==='ContextMenu'||(e.shiftKey&&e.key==='F10'))open(e);});

document.addEventListener('pointerdown',e=>{if(!e.target.closest('#projectContextMenu'))closeProjectContextMenu();});
document.addEventListener('scroll',()=>closeProjectContextMenu(),true);
window.addEventListener('resize',()=>closeProjectContextMenu());
document.addEventListener('keydown',e=>{
  const menu=document.getElementById('projectContextMenu');if(menu.hidden)return;

  else if(e.key==='Tab')closeProjectContextMenu();

  }

function openCompletedProjects() {

  for(const p of completedProjects()) {
    const row=el('div','restore-project');row.dataset.completedProjectId=p.id;

function personKey(name) { return name.trim().toLowerCase(); }
function ownerNames(value) {
  const names=new Map();
  for(const part of String(value||'').split(/[、,，;；\n]+/)){
    const name=part.trim();if(name&&!names.has(personKey(name)))names.set(personKey(name),name);
  }
  return [...names.values()];
}
function knownPeople() {
  const people=new Map();
  for(const person of state.people||[]) {
    const name=person.name?.trim();
    if(name)people.set(personKey(name),{name,employee_id:person.employee_id||''});
  }
  for(const record of [...state.tasks,...state.projects,...state.milestones]) {
    if(record.deleted_at)continue;
    for(const name of ownerNames(record.owner||'Ocean')){
      const key=personKey(name);if(!people.has(key))people.set(key,{name,employee_id:''});
    }
  }
  if(!people.size)people.set(personKey('Ocean'),{name:'Ocean',employee_id:''});
  return [...people.values()].sort((a,b)=>a.name.localeCompare(b.name,'zh-CN'));
}
function personPicker(input, commitOnSelect=false) {

    const selected=new Map((fromInput?ownerNames(input.value.slice(0,input.value.length-(input.value.split(/[、,，;；\n]/).pop()||'').length)):names).map(name=>[personKey(name),name]));

        option.dataset.name=person.name;option.setAttribute('role','option');option.setAttribute('aria-label',person.name);option.tabIndex=-1;

      applying=true;input.dispatchEvent(new Event('input',{bubbles:true}));applying=false;

    footer.append(cancel,confirm);popup.append(search,list,footer);

    const position=()=>{const box=wrap.getBoundingClientRect();popup.style.left=Math.max(8,Math.min(box.left,innerWidth-popup.offsetWidth-8))+'px';popup.style.top=Math.max(8,Math.min(box.bottom+4,innerHeight-popup.offsetHeight-8))+'px';};
    activePersonPicker.position=position;renderOptions();position();
    if(!fromInput)(options.find(o=>o.tabIndex===0)||search).focus({preventScroll:true});
    search.addEventListener('input',renderOptions);
    search.addEventListener('keydown',e=>{
      if(e.key==='ArrowDown'&&options.length){e.preventDefault();options[0].focus();}
      if(e.key==='Enter')e.preventDefault();
    });
    popup.addEventListener('keydown',e=>{
      const index=options.indexOf(document.activeElement);
      if(index>=0&&['ArrowDown','ArrowUp','Home','End'].includes(e.key)){
        e.preventDefault();options[index].tabIndex=-1;
        const next=options[e.key==='Home'?0:e.key==='End'?options.length-1:(index+(e.key==='ArrowDown'?1:-1)+options.length)%options.length];next.tabIndex=0;next.focus();
      }
      if(e.key==='Tab'&&((!e.shiftKey&&document.activeElement===confirm)||(e.shiftKey&&(document.activeElement===search||index>=0)))){
        e.preventDefault();closePersonPicker();
        const scope=input.closest('dialog')||document;
        const controls=[...scope.querySelectorAll('a[href],button,input,select,textarea,[tabindex],[contenteditable=true]')].filter(n=>!n.disabled&&n.tabIndex>=0&&n.getClientRects().length);
        (controls[controls.indexOf(toggle)+(e.shiftKey?-1:1)]||input).focus({preventScroll:true});
      }
    });
  }
  const toggle=btn('⌄',()=>{if(activePersonPicker?.toggle===toggle){closePersonPicker(true);return;}open();},'person-picker-toggle');
  toggle.setAttribute('aria-label','从人员名单选择负责人');toggle.setAttribute('aria-haspopup','listbox');toggle.setAttribute('aria-expanded','false');toggle.title='可多选，输入姓名或工号筛选，也可直接填写姓名';

  input.addEventListener('compositionend',()=>{if(!applying)open(true);});
  input.addEventListener('blur',()=>setTimeout(()=>{
    if(activePersonPicker?.input===input&&!wrap.contains(document.activeElement)&&!activePersonPicker.popup.contains(document.activeElement)){
      closePersonPicker();if(commitOnSelect)input.dispatchEvent(new Event('blur'));
    }
  },0));
  input.addEventListener('keydown',e=>{
    if(e.isComposing)return;
    if(e.key==='ArrowDown'){
      e.preventDefault();if(activePersonPicker?.input!==input)open(true);
      activePersonPicker?.popup.querySelector('[role=option]')?.focus();

  wrap.append(input,toggle);return wrap;

async function saveFollowupConfig(form,errorId,path,payload,success) {
  if(form.dataset.saving==='true')return false;
  const error=document.getElementById(errorId);error.textContent='';
  const controls=Array.from(form.elements).map(control=>[control,control.disabled]);
  form.dataset.saving='true';form.setAttribute('aria-busy','true');controls.forEach(([control])=>{control.disabled=true;});
  try {
    const ok=await mutate(path,'POST',payload,success,cause=>{
      error.textContent=cause.status===409
        ? cause.message+'。当前输入已保留，请复制需要保留的内容，取消并刷新页面后重新填写。'
        : '保存失败：'+cause.message+'。内容已保留，请重试。';
    });
    if(!ok&&!error.textContent)error.textContent='保存失败，内容已保留，请重试。';
    return ok;
  } finally {
    controls.forEach(([control,disabled])=>{control.disabled=disabled;});delete form.dataset.saving;form.removeAttribute('aria-busy');
  }
}
