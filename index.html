  }
}
document.getElementById('entityCancel').addEventListener('click',()=>document.getElementById('entityDialog').close());
document.getElementById('entityDialog').addEventListener('close',()=>{closeDatePicker();closePersonPicker();dialogContext=null;requestRender();});
document.getElementById('entityDialog').addEventListener('cancel',e=>{
  if(document.getElementById('entityForm').dataset.saving==='true')e.preventDefault();
});
document.getElementById('entityForm').addEventListener('submit',async e=>{
  e.preventDefault();const f=e.currentTarget;const c=dialogContext;
  if(!c||f.dataset.saving==='true')return;
  const payload={name:f.elements.name.value.trim(),owner:ownerNames(f.elements.owner.value).join('、')};
  if(!payload.name||!payload.owner){document.getElementById('entityError').textContent='请填写名称和负责人';return;}
  if(c.kind==='project') {
    Object.assign(payload,{goal:f.elements.goal.value.trim(),core:f.elements.core.checked,launch_date:f.elements.launch_date.value||null});
    const groupId=f.elements.dingtalk_group_id.value.trim();
    if(groupId!==(c.entity?.dingtalk_group_id||''))payload.dingtalk_group_id=groupId;
    for(const field of ['prd_url','materials_url']) {
      const value=f.elements[field].value.trim();
      if(value){
        try {const url=new URL(value);if(!['http:','https:'].includes(url.protocol)||url.username||url.password)throw new Error();}
        catch(_){document.getElementById('entityError').textContent='请填写有效的 http 或 https 地址';f.elements[field].focus();return;}
      }
      if(value!==(c.entity?.[field]||''))payload[field]=value;
    }
    if(!c.entity&&f.elements.template_id.value){payload.template_id=f.elements.template_id.value;payload.request_id=c.requestId;}
  }
  else Object.assign(payload,{due:f.elements.due.value||null,...(!c.entity?{project_id:c.project.id}:{})});
  if(c.entity){
    for(const key of Object.keys(payload))if(payload[key]===c.baseline[key])delete payload[key];
    if(!Object.keys(payload).length){document.getElementById('entityDialog').close();return;}
  }
  const base=c.kind==='project'?'/projects':'/milestones';
  const ok=await mutateEntity(base+(c.entity?'/'+encodeURIComponent(c.entity.id):'/add'),c.entity?'PATCH':'POST',payload,result=>{
    if(c.kind==='project'&&!c.entity)selectedProject=result.project?.id||'';
  });
  if(ok)document.getElementById('entityDialog').close();
});
function milestoneAddForm(p,m) {
  const key=p.id+':'+(m?.id||'unscheduled');
  const form=el('form','milestone-add');form.dataset.milestoneId=m?.id||'';
  const draft=addDrafts.get(key)||{text:'',owner:'Ocean',deadline:m?.due||''};
  for(const [name,type,placeholder] of [['text','text','＋ 添加事项'],['owner','text','负责人'],['deadline','date','截止日期']]) {
    const input=el('input');input.name=name;input.type=type;input.placeholder=placeholder;input.value=draft[name];input.required=true;input.setAttribute('aria-label',name==='text'?'事项名称':placeholder);
    if(name==='owner')input.autocomplete='off';
    if(type==='date')setupDateInput(input);
    input.addEventListener('input',()=>{addDrafts.set(key,{text:form.elements.text.value,owner:form.elements.owner.value,deadline:form.elements.deadline.value});});form.appendChild(name==='owner'?personPicker(input):input);
  }
  const add=el('button','subtle-button','添加');add.type='submit';form.appendChild(add);
  form.addEventListener('submit',async e=>{
    e.preventDefault();const payload={text:form.elements.text.value.trim(),owner:form.elements.owner.value.trim(),deadline:form.elements.deadline.value,project_id:p.id,milestone_id:m?.id||null,priority:'P1',tag:'work',source:'user'};
    if(!payload.text||!payload.owner||!payload.deadline){status('请填写事项、负责人和截止日期',true);return;}
    add.disabled=true;
    const ok=await mutate('/todos/add','POST',payload,()=>{
      if(form.elements.text.value.trim()===payload.text&&form.elements.owner.value.trim()===payload.owner&&form.elements.deadline.value===payload.deadline){addDrafts.delete(key);form.reset();form.elements.owner.value='Ocean';form.elements.deadline.value=milestoneById(m?.id)?.due||'';}
    });
    add.disabled=false;
    if(ok){requestRender();}
  });
  return form;
}
function renderMilestone(p,m) {
  const tasks=m?milestoneTasks(m):projectTasks(p).filter(t=>!t.milestone_id||!milestoneById(t.milestone_id)||milestoneById(t.milestone_id).deleted_at);
  tasks.sort((a,b)=>(a.project_sort_order??Infinity)-(b.project_sort_order??Infinity)||nextOrder(a,b));
  const complete=tasks.length>0&&tasks.every(t=>t.done);
  if(complete&&!showCompletedProjectItems)return null;
  const section=el('section','milestone'+(!tasks.length?' empty':''));if(m)section.dataset.milestoneId=m.id;
  const header=el('div','milestone-head');
  const heading=m&&!p.deleted_at?btn(m.name,()=>openEntity('milestone',m,p),'milestone-title'):el('span','milestone-title',m?.name||'待安排');
  if(m&&!p.deleted_at){heading.title='点击编辑里程碑；右键编辑或删除';bindMilestoneContextMenu(header,heading,m.id);}
  header.append(heading);
  const metaText=[m?.owner||p.owner||'Ocean',m?.due||'',tasks.length?`${tasks.filter(t=>t.done).length}/${tasks.length} 完成`:''].filter(Boolean).join(' · ');
  header.append(el('span','milestone-meta',metaText));
  if(m||projectMilestones(p).length)section.append(header);
  const body=el('div');
  const ul=el('ul');ul.dataset.projectId=p.id;ul.dataset.milestoneId=m?.id||'';
  for(const t of tasks)if(showCompletedProjectItems||!t.done){const row=renderTask(t,{projectView:true});ul.append(row);addDragHandle(row,true);}
  body.append(ul);
  if(!p.deleted_at&&showProjectAddForms)body.append(milestoneAddForm(p,m));
  section.append(body);return section;
}
function renderProjectDetail() {
  const root=document.getElementById('projectDetail');root.replaceChildren();
  const p=projectById(selectedProject);
  const heading=el('div','project-heading');const title=el('div','project-title-group');
  if(p){
    const name=el('h2','',p.name);name.tabIndex=0;name.setAttribute('role','button');name.setAttribute('aria-label','编辑项目：'+p.name);
    name.addEventListener('click',()=>openEntity('project',p));
    name.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openEntity('project',p);}});
    bindProjectContextEdit(name,p.id);name.title='点击编辑项目；右键打开菜单';title.append(name);
    const resources=el('div','project-resources');
    for(const [field,label] of [['prd_url','PRD'],['materials_url','运营物料']]){
      let url;try{url=new URL(p[field]);if(!['http:','https:'].includes(url.protocol)||url.username||url.password)url=null;}catch(_){url=null;}
      if(url){const link=el('a','project-resource',label);link.href=url.href;link.target='_blank';link.rel='noopener noreferrer';link.title='打开'+label;resources.append(link);}
      else resources.append(btn(label,()=>{openEntity('project',p);document.getElementById('entityForm').elements[field].focus();},'project-resource empty'));
    }
    title.append(resources);
    title.append(btn(p.launch_date?'预计上线：'+p.launch_date.replaceAll('-','/'):'预计上线：未设',()=>{
      openEntity('project',p);document.getElementById('entityForm').elements.launch_date.focus();
    },'project-resource project-launch-date'));
  }heading.append(title);
  const actions=el('div','project-actions');
  const buttons=[];
  if(p&&!p.deleted_at) {
    const addToggle=btn(showProjectAddForms?'收起新增':'新增事项',()=>{
      showProjectAddForms=!showProjectAddForms;requestRender();
      document.getElementById('projectAddToggle')?.focus({preventScroll:true});
    },'project-add-toggle');
    addToggle.id='projectAddToggle';addToggle.setAttribute('aria-pressed',String(showProjectAddForms));actions.append(addToggle);
    const completedLabel=el('label','completed-visibility');
    const completed=el('input');completed.type='checkbox';completed.id='showCompletedProjectItems';completed.checked=showCompletedProjectItems;
    completed.title='显示已完成的事项和里程碑';
    completed.addEventListener('change',()=>{
      showCompletedProjectItems=completed.checked;localStorage.setItem('tracking-show-completed',String(showCompletedProjectItems));
      requestRender();document.getElementById('showCompletedProjectItems')?.focus({preventScroll:true});
    });
    completedLabel.append(completed,el('span','','显示已完成'));actions.append(completedLabel);
    buttons.push(btn('添加里程碑',()=>openEntity('milestone',null,p)),btn('里程碑排序',()=>openMilestoneOrder(p)),btn('删除',()=>deleteProjectById(p.id),'danger'));
    buttons.splice(2,0,btn(p.template_snapshot?'更新任务模板':'保存为任务模板',async e=>{
      const button=e.currentTarget;button.disabled=true;
      await mutate('/projects/'+encodeURIComponent(p.id)+'/template','POST',{},()=>showToast('任务模板已保存'));button.disabled=false;
    }));
  }
  if(completedProjects().length)buttons.push(btn('已完成项目',openCompletedProjects));
  if(state.projects.some(project=>project.archived||project.deleted_at))buttons.push(btn('恢复项目',openProjectRestore));
  if(buttons.length)actions.append(settingsMenu('项目设置',buttons));
  heading.append(actions);root.append(heading);
  if(!p){root.append(el('div','project-empty','选择一个项目查看进展，或点击左侧「＋ 新增项目」。'));return;}
  if(p.goal)root.append(el('p','project-goal',p.goal));
  if(p.deleted_at){root.append(el('p','project-hint','项目在回收站；事项仍保留在「事情跟进」。恢复项目后恢复尚未调整的关联。'));return;}
  const progress=projectProgress(p);
  const summary=el('div','project-progress');
  summary.append(el('b','',projectComplete(p)?'已完成':progress.milestones.length?`当前：${progress.current?.name||'里程碑已完成'}`:'进行中'),el('span','',`${progress.done}/${progress.tasks.length} 项完成`+(progress.milestones.length?` · ${progress.milestonesDone}/${progress.milestones.length} 个里程碑完成`:'')));
  if(progress.milestones.length&&progress.next)summary.append(el('span','','下一步：'+progress.next.text));
  if(progress.overdue)summary.append(el('span','overdue-text',progress.overdue+' 项逾期'));
  if(progress.tasks.length)root.append(summary);
  progress.milestones.forEach(m=>{const section=renderMilestone(p,m);if(section)root.append(section);});
  const hasUnscheduled=projectTasks(p).some(t=>!t.milestone_id||!milestoneById(t.milestone_id)||milestoneById(t.milestone_id).deleted_at);
  if(hasUnscheduled||!progress.milestones.length){const section=renderMilestone(p,null);if(section)root.append(section);}
  if(!root.querySelector('.milestone'))root.append(el('p','project-hint','暂无未完成事项'));
  const deleted=state.milestones.filter(m=>m.project_id===p.id&&m.deleted_at);
  if(deleted.length){
    const section=el('details','deleted-milestones');section.append(el('summary','',`已删除里程碑（${deleted.length}）`));
    for(const m of deleted){const row=el('div','deleted-milestone');row.append(el('span','',m.name),btn('恢复',()=>mutate('/milestones/'+encodeURIComponent(m.id)+'/restore','POST',{}),'subtle-button'));section.append(row);}root.append(section);
  }
}
document.getElementById('newTaskMore').addEventListener('click',e=>{
  const options=document.getElementById('newTaskOptions');options.hidden=!options.hidden;
  e.currentTarget.setAttribute('aria-expanded',String(!options.hidden));
  e.currentTarget.textContent=options.hidden?'更多':'收起';
});
document.getElementById('newTaskForm').addEventListener('submit',async e=>{
  e.preventDefault();const text=document.getElementById('newText'),owner=document.getElementById('newOwner'),date=document.getElementById('newDeadline');
  if(!text.value.trim()||!owner.value.trim()||!date.value){status('请填写事项、负责人和截止日期。',true);return;}
  const payload={text:text.value.trim(),owner:owner.value.trim(),deadline:date.value,priority:document.getElementById('newPri').value,tag:document.getElementById('newTag').value,source:'user',...associationPatch(document.getElementById('newAssociation').value)};
  const submit=document.getElementById('addBtn');submit.disabled=true;
  const ok=await mutate('/todos/add','POST',payload,()=>{
    if(text.value.trim()===payload.text&&owner.value.trim()===payload.owner&&date.value===payload.deadline){text.value='';owner.value='Ocean';date.value='';document.getElementById('newAssociation').value='';}
  });
  submit.disabled=false;if(ok){requestRender();text.focus();}
});
