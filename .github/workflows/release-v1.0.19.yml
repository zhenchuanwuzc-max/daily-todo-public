name: Release v1.0.19

on:
  push:
    tags:
      - v1.0.19

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify source
        run: |
          python3 -m py_compile server.py
          python3 -m unittest discover -s tests -v
          test "$(cat VERSION)" = "${GITHUB_REF_NAME#v}"
      - name: Build universal app from verified v1.0.18 bundle
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://github.com/zhenchuanwuzc-max/daily-todo-public/releases/download/v1.0.18/daily-todo-1.0.18-macos-universal.zip' \
            -o base.zip
          echo '15bb9edca36e43b0abef6e4950cc10c66d94665069c0a6e2e4590525616a6a48  base.zip' | shasum -a 256 -c -
          mkdir -p staging
          ditto -x -k base.zip staging
          app='staging/每日待办.app'
          test -d "$app"
          cp server.py "$app/Contents/Resources/server.py"
          cp index.html "$app/Contents/Resources/index.html"
          cp VERSION "$app/Contents/Resources/VERSION"
          plutil -replace CFBundleVersion -string "${GITHUB_REF_NAME#v}" "$app/Contents/Info.plist"
          plutil -replace CFBundleShortVersionString -string "${GITHUB_REF_NAME#v}" "$app/Contents/Info.plist"
          lipo -archs "$app/Contents/MacOS/每日待办" | grep -q 'x86_64'
          lipo -archs "$app/Contents/MacOS/每日待办" | grep -q 'arm64'
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "daily-todo-${GITHUB_REF_NAME#v}-macos-universal.zip"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: daily-todo-1.0.19-macos-universal.zip
          body: |
            修复“立即更新”因 GitHub 匿名 API 限流而返回 HTTP 403 的问题。
            公开版本改用 Release 页面获取版本和安装包，并在安装前校验 SHA-256。
