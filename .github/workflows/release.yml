name: Release macOS app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'setuptools==58.0.4' 'wheel' \
            'py2app==0.28.9' 'pywebview==6.2.1' \
            'APScheduler==3.11.3' 'tzlocal==5.3.1' \
            'pyobjc-core==11.1' \
            'pyobjc-framework-Cocoa==11.1' \
            'pyobjc-framework-Quartz==11.1' \
            'pyobjc-framework-Security==11.1' \
            'pyobjc-framework-UniformTypeIdentifiers==11.1' \
            'pyobjc-framework-WebKit==11.1'
      - name: Test and build from source
        run: |
          set -euo pipefail
          python -m py_compile server.py
          python -m unittest discover -s tests -v
          test "$(cat VERSION)" = "${GITHUB_REF_NAME#v}"
          python setup.py py2app
          app='dist/每日待办.app'
          test -d "$app"
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "${GITHUB_REF_NAME#v}"
          cmp server.py "$app/Contents/Resources/server.py"
          cmp index.html "$app/Contents/Resources/index.html"
          python - <<'PY'
          from pathlib import Path
          import platform, subprocess, zipfile
          root = Path('dist/每日待办.app/Contents')
          expected = '${{ matrix.arch }}'
          assert platform.machine() == expected
          archive, = (root / 'Resources/lib').glob('python*.zip')
          with zipfile.ZipFile(archive) as z:
              embedded = z.read('server.pyc')
              assert b'reorder_projects' in embedded and b'launch_date' in embedded
          binaries = 0
          for path in root.rglob('*'):
              if not path.is_file() or path.is_symlink():
                  continue
              if 'Mach-O' in subprocess.check_output(['file', '-b', str(path)], text=True):
                  arches = subprocess.check_output(['lipo', '-archs', str(path)], text=True).split()
                  assert expected in arches, (str(path), arches)
                  binaries += 1
          assert binaries > 1, 'Native runtime was not packaged'
          PY
          codesign --verify --deep --strict "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "daily-todo-${GITHUB_REF_NAME#v}-macos-${{ matrix.arch }}.zip"
          shasum -a 256 daily-todo-*-macos-${{ matrix.arch }}.zip > SHA256SUMS-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            daily-todo-*-macos-${{ matrix.arch }}.zip
            SHA256SUMS-${{ matrix.arch }}.txt

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 每日待办 ${{ github.ref_name }} · 项目跟进版
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: release-assets/*
          body_path: docs/RELEASE-1.1.1.md
